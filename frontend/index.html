<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f11">
  <meta name="description" content="Compare walking routes in Ireland after dark using recorded lighting and historical activity.">
  <title>Ireland After Dark</title>
</head>
<body>
  <div id="map"></div>

  <header class="brand">
    <span class="brand-mark" aria-hidden="true">◐</span>
    <span>Ireland <b>After Dark</b></span>
  </header>

  <section class="panel" id="panel" aria-label="Route planner">
    <p id="hint" class="hint">Click the map to set your <b>start</b>.</p>
    <div id="pins" class="pins" hidden>
      <span id="pin-origin" class="pin"></span>
      <span id="pin-destination" class="pin"></span>
    </div>
    <button id="compare" type="button" disabled>Compare routes</button>
    <button id="reset" type="button" class="link" hidden>Choose different points</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="sheet" class="sheet" aria-label="Route comparison" hidden>
    <div class="sheet-handle"></div>
    <button id="sheet-close" class="close" type="button" aria-label="Close comparison">✕</button>
    <div id="sheet-body"></div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
