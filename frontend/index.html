<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f11">
  <meta name="description" content="Compare walking routes in Ireland after dark using recorded lighting and historical activity.">
  <title>Ireland After Dark</title>
</head>
<body>
  <div id="map"></div>

  <header class="brand">
    <span class="brand-mark" aria-hidden="true">◐</span>
    <span>Ireland <b>After Dark</b></span>
  </header>

  <aside class="sidebar" aria-label="Plan and compare walking routes">
  <form class="panel" id="panel" aria-label="Route planner">
    <label for="origin-input">Start</label>
    <input id="origin-input" type="text" placeholder="Place or latitude, longitude" autocomplete="off" required>
    <label for="destination-input">Destination</label>
    <input id="destination-input" type="text" placeholder="Place or latitude, longitude" autocomplete="off" required>
    <label for="departure">Departure (Ireland time)</label>
    <input id="departure" type="datetime-local" required>
    <p class="input-hint">Or click the map for start, then destination. Place search uses OpenStreetMap; Eircodes may not resolve.</p>
    <button id="compare" type="submit">Find route</button>
    <p id="status" role="status" aria-live="polite"></p>
    <label class="layer-control"><input id="show-stops" type="checkbox"> Show Luas stops</label>
    <p id="transport-status" class="input-hint" role="status" aria-live="polite"></p>
  </form>

  <section id="sheet" class="sheet" aria-label="Route comparison" hidden>
    <div class="sheet-handle"></div>
    <button id="sheet-close" class="close" type="button" aria-label="Close comparison">✕</button>
    <p id="sheet-intro" class="sheet-intro"></p>
    <div id="sheet-body"></div>
  </section>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
