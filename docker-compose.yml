services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ireland-after-dark-backend
    env_file: .env
    volumes:
      # Host-built graph cache + edge-score bundle (gitignored, built once via
      # `backend/routing/README.md`'s setup steps) — not baked into the image.
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_TILE_URL: ${VITE_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    container_name: ireland-after-dark-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
