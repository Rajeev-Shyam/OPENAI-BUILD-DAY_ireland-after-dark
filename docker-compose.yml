services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ireland-after-dark-backend
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: ireland-after-dark-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
